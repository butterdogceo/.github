name: generate badge
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * 0'

permissions: write-all

jobs:
  update:
    name: Update stats card
    runs-on: ubuntu-latest
    steps:
      - uses: datarootsio/github-stats-card@v1
        with:
          username: butterdogceo
          gh_token_stats: ${{ secrets.GITHUB_TOKEN }}
          gh_token_commits: ${{ secrets.GITHUB_TOKEN }}
          badge_path: assets/badge.svg
          header: "👋 Hello,"
          about: "I create websites, apps, games, and more."
          theme: dark
          commit_message: Badge generated by the treadmill bunnies.
